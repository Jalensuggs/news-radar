name: News Radar

on:
  schedule:
    # 每日报告：22:00 UTC = 悉尼时间 08:00 AEST (UTC+10)
    # 注：夏令时 AEDT (UTC+11) 期间会在 09:00 悉尼时间触发
    - cron: '0 22 * * *'

    # 突发新闻：每2小时检测一次
    - cron: '0 */2 * * *'

  # 允许手动触发（用于测试）
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - breaking

jobs:
  monitor:
    name: News Monitor (${{ github.event.schedule || inputs.mode || 'manual' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            echo "value=daily" >> $GITHUB_OUTPUT
          else
            echo "value=breaking" >> $GITHUB_OUTPUT
          fi

      - name: Run News Monitor
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          echo "▶ Mode: ${{ steps.mode.outputs.value }}"
          python news_monitor.py ${{ steps.mode.outputs.value }}
